<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My QR Code Generator</title>
</head>
<body>
  <h1>QR Code Generator</h1>

  <label for="type">What is the QR code for?</label>
  <select id="type">
    <option value="link">Link</option>
    <option value="text">Text</option>
  </select>

  <br><br>

  <label for="input">Enter your link or text:</label>
  <input type="text" id="input" placeholder="https://example.com">

  <br><br>

  <button id="generate">Generate QR Code</button>

  <div id="qr"></div>
    <script>
    // Find the dropdown and the four groups of fields
    const typeSelect = document.getElementById("type");
    const groups = {
      link: document.getElementById("link-fields"),
      text: document.getElementById("text-fields"),
      whatsapp: document.getElementById("whatsapp-fields"),
      upi: document.getElementById("upi-fields")
    };

    // Show only the group that matches the dropdown
    function showSelectedFields() {
      const selected = typeSelect.value;
      for (const name in groups) {
        groups[name].hidden = (name !== selected);
      }
    }

    // Run the function whenever the dropdown changes
    typeSelect.addEventListener("change", showSelectedFields);

    // Run it once when the page loads
    showSelectedFields();
  </script>
</body>
</html>
